###############################################################################
# dnsmasq как локальный кеширующий форвардер для nginx (Free-узлы и Pro-воркеры)
#
# СГЕНЕРИРОВАНО автоматически из {{source}} — не правьте этот файл руками.
# Дата: {{date}}
#
# Здесь НЕТ ни одной address= записи: подмену адресов для клиентов делает
# pro_dns.py на публичном IP DNS-ноды. Этот dnsmasq слушает только 127.0.0.1:53
# и служит общим кеширующим резолвером для всех воркеров nginx (resolver 127.0.0.1).
#
# all-servers отправляет cache-miss одновременно на все апстримы и возвращает
# самый быстрый ответ — это защищает от эпизодических потерь UDP:53-пакетов
# к отдельным публичным DNS на стороне хостера.
#
# filter-AAAA здесь намеренно отсутствует: nginx сам запрашивает только A
# (ipv6=off в директиве resolver).
###############################################################################

listen-address=127.0.0.1
port=53
bind-interfaces
no-resolv
no-poll
no-hosts
server=1.1.1.1
server=8.8.8.8
server=9.9.9.9
all-servers
cache-size=10000
min-cache-ttl=60
max-cache-ttl=3600
neg-ttl=30
dns-forward-max=2000
max-tcp-connections=500
bogus-priv
