###############################################################################
# dnsmasq как локальный кеширующий форвардер для DNS-ноды Перевал Pro
#
# СГЕНЕРИРОВАНО автоматически из {{source}} — не правьте этот файл руками.
# Дата: {{date}}
#
# Здесь НЕТ ни одной address= записи: подмену адресов для подписчиков делает
# pro_dns.py (публичный IP, порты 53/853 + DoH за nginx). Этот dnsmasq слушает
# только 127.0.0.1:53 и нужен для двух вещей:
#   1. upstream с кешем для pro_dns.py (всё, что не входит в каталог);
#   2. системный резолвер самой ноды (/etc/resolv.conf -> 127.0.0.1), чтобы
#      pro_dns.py и nginx резолвили {{site_domain}}, воркеры и Let's Encrypt.
#
# filter-AAAA здесь намеренно отсутствует: IPv6 фильтруется только для доменов
# каталога внутри pro_dns.py, а не для всего интернета.
###############################################################################

listen-address=127.0.0.1
port=53
bind-interfaces
no-resolv
no-hosts
server=1.1.1.1
server=8.8.8.8
cache-size=50000
min-cache-ttl=60
dns-forward-max=2000
max-tcp-connections=500
bogus-priv
