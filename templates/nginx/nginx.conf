###############################################################################
# nginx: SNI-прокси для сервисов, закрытых для России и Беларуси (Free-кластер)
#
# СГЕНЕРИРОВАНО автоматически из {{source}} — не правьте этот файл руками,
# изменения потеряются. Правьте templates/nginx/nginx.conf и запускайте src/generate.py.
#
# Разрешено {{total}} доменов. Списки: nginx-sni-allow.map для TLS на 443
# и nginx-host-allow.map для открытого HTTP на 80. Дата: {{date}}
#
#   ноутбук --DNS--> dnsmasq на этой машине  -> A-запись {{ip}}
#   ноутбук --TCP--> nginx  на этой машине   -> настоящий origin, с адреса КЗ
#
# DNS-имена этой ноды: {{free_domains}}. Сайт, кабинет и API живут на
# {{origin}} — все запросы к страницам отсюда уходят туда редиректом 301,
# а DoH (/dns-query), DoT (:853) и JSON статистики продолжают работать по всем
# именам, чтобы старые профили и настройки не ломались.
#
# TLS не терминируется. Блок stream читает имя хоста из открытой части
# ClientHello и сращивает TCP-сессию с настоящим сервером. Отсюда следует:
#   * никаких сертификатов, ключей и своего CA на клиенте
#   * ноутбук проверяет настоящий сертификат origin, сквозным образом
#   * эта машина не может прочитать трафик, только имя хоста
#
# УСТАНОВКА
#   mkdir -p /etc/nginx/geoblock
#   cp nginx-sni-allow.map nginx-host-allow.map /etc/nginx/geoblock/
#   cp nginx.conf /etc/nginx/nginx.conf
#   nginx -t && systemctl reload nginx
#
# В firewall должны быть открыты TCP 80, TCP 443 и TCP 853 (DNS-over-TLS для
# iOS и Android), а UDP 443 — закрыт через reject: ssl_preread не читает QUIC,
# а reject заставляет браузер сразу откатиться с HTTP/3 на TCP вместо ожидания
# таймаута:
#   ufw allow 853/tcp
#
# Блок stream — контекст верхнего уровня, в conf.d/ его положить нельзя:
# Debian подключает conf.d внутри http.
###############################################################################

user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

# На RHEL/Alma stream бывает динамическим модулем. В Debian и Ubuntu
# он собран внутрь nginx-full, там строка не нужна.
#load_module modules/ngx_stream_module.so;

events {
	worker_connections 32768;
	multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	server_tokens off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;

	##
	# Gzip Settings
	##

	gzip on;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;

	# ВНИМАНИЕ: include sites-enabled отключён намеренно. В Debian там лежит
	# сайт default с «listen 80 default_server», и он перехватывал бы запросы
	# у прокси ниже — nginx ругался бы на «duplicate default server».
	# Если на этой машине действительно нужен свой сайт, включите обратно
	# и уберите default_server у прокси.
	#include /etc/nginx/sites-enabled/*;

	###########################################################################
	# TCP/80 — обычный HTTP. Нужен не браузерам (они сами поднимают до HTTPS),
	# а тому, что так не умеет: curl и wget в скриптах, установщики SDK,
	# репозитории вендоров и старые корпоративные сайты, отдающие http://
	# с редиректом. Из-за подмены DNS закрытый 80-й порт даёт не откат
	# на прямое соединение, а connection refused — то есть «сайт не работает
	# вообще» вместо понятного редиректа.
	#
	# ssl_preread здесь не применим: трафик открытый, поэтому это настоящий
	# реверс-прокси по Host, и allowlist ниже обязателен.
	###########################################################################
	resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;   # то же правило, что в stream
	resolver_timeout 5s;

	map $host $http_allow_target {
		hostnames;
		default  "";
		include  /etc/nginx/geoblock/nginx-host-allow.map;
	}

	include /etc/nginx/geoblock/nginx-workers-http.conf;

	log_format hostproxy '$remote_addr [$time_local] "$request" host="$host" '
	                     '-> $upstream_addr $status $body_bytes_sent';

	server {
		listen 80 default_server;
		# На хосте без IPv6 эта строка не даст nginx запуститься
		# («Address family not supported»). Клиентам она и не нужна:
		# dnsmasq отдаёт только записи A.
		#listen [::]:80 default_server;
		server_name _;

		access_log /var/log/nginx/http-proxy.log hostproxy buffer=32k flush=5s;

		location = /healthz {
			access_log off;
			default_type text/plain;
			return 200 "ok\n";
		}

		location = /node-stats.json {
			root /var/www/geoblock;
			default_type application/json;
			add_header Cache-Control "no-store, no-cache, must-revalidate";
			access_log off;
		}

		client_max_body_size 0;      # не ограничивать загрузки
		proxy_http_version 1.1;

		location / {
			# Ничего, кроме списка. Пустой $http_upstream — это либо чужой домен,
			# либо запрос в absolute-form от того, кто ищет открытый прокси.
			if ($http_upstream = "") {
				return 403 "not in geoblock allowlist";
			}

			proxy_pass http://$http_upstream;
			proxy_set_header Host            $host;
			proxy_set_header Connection      "";

			# Не отдавать origin российский адрес клиента — иначе вся
			# затея с казахстанским выходом теряет смысл.
			proxy_set_header X-Forwarded-For "";
			proxy_set_header X-Real-IP       "";

			proxy_connect_timeout 10s;
			proxy_read_timeout    600s;
			proxy_send_timeout    600s;
			proxy_buffering       off;   # потоковые ответы остаются потоковыми
			proxy_redirect        off;   # редиректы origin отдаём клиенту как есть
		}
	}

	###########################################################################
	# Имена DNS-ноды ({{free_server_names}}): HTTP-01 для Let's Encrypt на 80-м
	# порту и локальный HTTPS-сервер на 127.0.0.1:8443 (куда stream с 443-го порта
	# направляет соединения с этими SNI). Здесь живут только технические адреса:
	# DNS-over-HTTPS (/dns-query) и JSON статистики. Страницы сайта и профиль
	# iOS переехали на {{origin}} — на них редирект 301 с сохранением пути.
	###########################################################################
	upstream doh_backend {
		server 127.0.0.1:8053;
		keepalive 64;
	}

	# Старые адреса страниц -> новые пути на сайте {{origin}}
	map $uri $pereval_site_uri {
		default            $uri;
		/index.html        /;
		/pro.html          /pro;
		/dedicated.html    /dedicated;
		/stats.html        /stats;
		/terms.html        /terms;
		/privacy.html      /privacy;
	}

	server {
		listen 80;
		server_name {{free_server_names}};

		location = /healthz {
			access_log off;
			default_type text/plain;
			return 200 "ok\n";
		}

		location = /node-stats.json {
			root /var/www/geoblock;
			default_type application/json;
			add_header Cache-Control "no-store, no-cache, must-revalidate";
			access_log off;
		}

		location ^~ /.well-known/acme-challenge/ {
			default_type "text/plain";
			root /var/www/geoblock;
		}

		location = /dns-query {
			return 301 https://$host$request_uri;
		}

		location / {
			return 301 {{origin}}$pereval_site_uri$is_args$args;
		}
	}

	server {
		listen 127.0.0.1:8443 ssl http2;
		server_name {{free_server_names}};

		ssl_certificate     /etc/nginx/geoblock/ssl/fullchain.pem;
		ssl_certificate_key /etc/nginx/geoblock/ssl/privkey.pem;

		root /var/www/geoblock;

		# RFC 8484 DNS-over-HTTPS (DoH) для браузеров (Firefox, Chrome, Edge, Brave, Яндекс)
		location = /dns-query {
			proxy_pass http://doh_backend;
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			proxy_set_header Host $host;
			proxy_connect_timeout 2s;
			proxy_send_timeout 5s;
			proxy_read_timeout 5s;
			proxy_buffering off;
			client_max_body_size 4k;
			access_log off;
		}

		location = /healthz {
			access_log off;
			default_type text/plain;
			return 200 "ok\n";
		}

		# JSON статистики читает сайт {{origin}} (серверно через /api/stats и,
		# как запасной вариант, из браузера — отсюда CORS).
		location ~ ^/(stats|node-stats|cluster-health)\.json$ {
			default_type application/json;
			add_header Cache-Control "no-store, no-cache, must-revalidate";
			add_header Access-Control-Allow-Origin "{{origin}}" always;
			access_log off;
		}

		# Форма заявок со старых закешированных страниц: 308 сохраняет метод POST.
		location = /api/leads {
			return 308 {{origin}}/api/leads;
		}

		# Профиль iOS и все страницы — на сайте
		location / {
			return 301 {{origin}}$pereval_site_uri$is_args$args;
		}
	}
}

###############################################################################
# TCP/443 — маршрутизация по SNI. Основная часть.
###############################################################################
stream {
    ###########################################################################
    # ВАЖНО: резолвер должен быть внешним, ни в коем случае не 127.0.0.1.
    #
    # dnsmasq на этой же машине отвечает на claude.ai адресом {{ip}} — то есть
    # самим собой. Если бы nginx пользовался системным резолвером, он разрешил
    # бы origin в свой же адрес и крутился в петле, пока не кончатся сокеты.
    # Запрос напрямую к 1.1.1.1 обходит dnsmasq и даёт настоящий адрес.
    #
    # По той же причине /etc/resolv.conf этого хоста должен указывать
    # на 1.1.1.1 или 8.8.8.8, а НЕ на локальный dnsmasq.
    ###########################################################################
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    # ---- SNI -> upstream ---------------------------------------------------
    # Всё, чего нет в списке, уходит на discard-порт, и сессия закрывается.
    # Без этого default сервер был бы открытым TCP-релеем на любой хост
    # в интернете — за такое VPS в Казахстане закрывают быстро.
    map $ssl_preread_server_name $sni_allow_target {
        hostnames;
        default  127.0.0.1:9;
{{free_sni_targets}}
        include  /etc/nginx/geoblock/nginx-sni-allow.map;
    }

    include /etc/nginx/geoblock/nginx-workers-stream.conf;

    log_format sni '$remote_addr [$time_local] sni="$ssl_preread_server_name" '
                   'up=$upstream_addr status=$status '
                   'sent=$bytes_sent recv=$bytes_received dur=$session_time';

    access_log /var/log/nginx/sni.log sni buffer=64k flush=5s;
    error_log /var/log/nginx/stream-error.log warn;

    server {
        listen 443 reuseport;
        # На хосте без IPv6 эта строка не даст nginx запуститься.
        #listen [::]:443 reuseport;

        ssl_preread on;
        preread_timeout 5s;

        # Ограничение по источнику. Лучше делать в nftables, но здесь тоже
        # не помешает: раскомментируйте и перечислите свои префиксы.
        #allow 203.0.113.0/24;
        #deny all;

        proxy_pass $sni_upstream;
        proxy_connect_timeout 10s;

        # Таймаут простоя, не общий. Должен быть больше паузы между токенами
        # в SSE-потоке: Claude и ChatGPT держат один ответ открытым долго,
        # и на 30s соединение обрывалось бы посреди ответа.
        proxy_timeout 300s;

        proxy_buffer_size 32k;
        proxy_socket_keepalive on;
    }

    ###########################################################################
    # TCP/853 — DNS-over-TLS (DoT) для профиля iOS / iPadOS и Android Private DNS.
    # Терминирует TLS одним сертификатом с SAN на все имена ({{free_domains}})
    # и передаёт TCP DNS-запросы в локальный dnsmasq на 127.0.0.1:53.
    ###########################################################################
    ssl_session_cache   shared:DOT:10m;
    ssl_session_timeout 4h;
    ssl_session_tickets on;

    server {
        listen 853 ssl reuseport;

        ssl_certificate     /etc/nginx/geoblock/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/geoblock/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_handshake_timeout 10s;

        proxy_pass 127.0.0.1:53;
        proxy_connect_timeout 3s;
        proxy_timeout 15s;
    }
}
