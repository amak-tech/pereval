###############################################################################
# nginx для DNS-ноды Перевал Pro ({{pro_domain}})
#
# СГЕНЕРИРОВАНО автоматически из {{source}} — не правьте этот файл руками.
# Правьте templates/nginx/pro-dns-nginx.conf и запускайте src/generate.py.
# Дата: {{date}}
#
# Роль ноды: персональный DNS для подписчиков Pro.
#   * TCP/443 — DoH: https://{{pro_domain}}/dns/<token>  -> pro_dns.py (127.0.0.1:8057)
#   * TCP/853 — DoT: <token>.{{pro_domain}} — слушает САМ pro_dns.py (TLS с SNI),
#               nginx порт 853 не трогает
#   * UDP/TCP 53 — обычный DNS по привязанному IP — тоже pro_dns.py
#
# Сертификат: wildcard *.{{pro_domain}} + {{pro_domain}} (Let's Encrypt, DNS-01
# вручную), копия лежит в /etc/pereval/ssl/ (её же читает pro_dns.py).
###############################################################################

user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 16384;
	multi_accept on;
}

http {
	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	server_tokens off;
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers on;
	ssl_session_cache shared:PRODNS:10m;
	ssl_session_timeout 4h;

	# IP клиентов DNS не логируем — приватность важнее отладки.
	access_log off;

	upstream pro_dns_backend {
		server 127.0.0.1:8057;
		keepalive 64;
	}

	server {
		listen 80 default_server;
		server_name {{pro_domain}} *.{{pro_domain}};

		location = /healthz {
			default_type text/plain;
			return 200 "ok\n";
		}

		location ^~ /.well-known/acme-challenge/ {
			default_type "text/plain";
			root /var/www/pereval-pro;
		}

		location / {
			return 301 {{origin}}/;
		}
	}

	server {
		listen 443 ssl http2 default_server;
		server_name {{pro_domain}} *.{{pro_domain}};

		ssl_certificate     /etc/pereval/ssl/fullchain.pem;
		ssl_certificate_key /etc/pereval/ssl/privkey.pem;

		root /var/www/pereval-pro;

		# RFC 8484 DNS-over-HTTPS с персональным токеном в пути.
		# Токен: 20 символов base32 (a-z, 2-7). Остальное — 404.
		location ~ "^/dns/(?<tok>[a-z2-7]{20})$" {
			proxy_pass http://pro_dns_backend/dns-query$is_args$args;
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			proxy_set_header Host $host;
			proxy_set_header X-Pereval-Token $tok;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_connect_timeout 2s;
			proxy_send_timeout 5s;
			proxy_read_timeout 5s;
			proxy_buffering off;
			client_max_body_size 4k;
		}

		location = /healthz {
			proxy_pass http://pro_dns_backend/healthz;
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			proxy_connect_timeout 2s;
			proxy_read_timeout 3s;
		}

		location = /pro-health.json {
			default_type application/json;
			add_header Cache-Control "no-store, no-cache, must-revalidate";
			add_header Access-Control-Allow-Origin "{{origin}}" always;
		}

		location / {
			return 404;
		}
	}
}
