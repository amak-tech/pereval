###############################################################################
# nginx для прокси-воркера Перевал Pro
#
# СГЕНЕРИРОВАНО автоматически из {{source}} — не правьте этот файл руками.
# Правьте templates/nginx/pro-worker-nginx.conf и запускайте src/generate.py.
#
# Разрешено {{total}} доменов (каталог Free + Pro). Списки:
# /etc/nginx/geoblock/nginx-sni-allow.map (TLS на 443) и
# /etc/nginx/geoblock/nginx-host-allow.map (открытый HTTP на 80). Дата: {{date}}
#
# Отличия от Free-ноды: нет сайта, DoH и DoT — только прозрачный SNI/Host-прокси.
# Доступ к портам 80/443 закрыт nftables и открывается только IP-адресам
# подписчиков (набор pro_clients синхронизирует pro_node_agent.py с control plane).
# Пробы здоровья приходят с DNS-ноды и control plane ({{trusted_probe_ips_nft}}).
###############################################################################

user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 32768;
	multi_accept on;
}

http {
	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	server_tokens off;
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	access_log /var/log/nginx/access.log;

	resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
	resolver_timeout 5s;

	map $host $http_allow_target {
		hostnames;
		default  "";
		include  /etc/nginx/geoblock/nginx-host-allow.map;
		include  /etc/nginx/geoblock/extra-host-allow.map;   # домены арендатора (Dedicated), пишет pro_node_agent.py
	}

	# Воркер всегда выходит напрямую на origin со своего IP.
	map $http_allow_target $http_upstream {
		default           $http_allow_target;
		"__WORKERS__"     $host;
	}

	log_format hostproxy '$remote_addr [$time_local] "$request" host="$host" '
	                     '-> $upstream_addr $status $body_bytes_sent';

	server {
		listen 80 default_server;
		server_name _;

		access_log /var/log/nginx/http-proxy.log hostproxy buffer=32k flush=5s;

		location = /healthz {
			access_log off;
			default_type text/plain;
			return 200 "ok\n";
		}

		location = /node-stats.json {
			root /var/www/geoblock;
			default_type application/json;
			add_header Cache-Control "no-store, no-cache, must-revalidate";
			access_log off;
		}

		client_max_body_size 0;
		proxy_http_version 1.1;

		location / {
			if ($http_upstream = "") {
				return 403 "not in pereval allowlist";
			}

			proxy_pass http://$http_upstream;
			proxy_set_header Host            $host;
			proxy_set_header Connection      "";
			proxy_set_header X-Forwarded-For "";
			proxy_set_header X-Real-IP       "";

			proxy_connect_timeout 10s;
			proxy_read_timeout    600s;
			proxy_send_timeout    600s;
			proxy_buffering       off;
			proxy_redirect        off;
		}
	}
}

stream {
	resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
	resolver_timeout 5s;

	map $ssl_preread_server_name $sni_allow_target {
		hostnames;
		default  127.0.0.1:9;
		include  /etc/nginx/geoblock/nginx-sni-allow.map;
		include  /etc/nginx/geoblock/extra-sni-allow.map;    # домены арендатора (Dedicated), пишет pro_node_agent.py
	}

	map $sni_allow_target $sni_upstream {
		default           $sni_allow_target;
		"__WORKERS__"     $ssl_preread_server_name:443;
	}

	log_format sni '$remote_addr [$time_local] sni="$ssl_preread_server_name" '
	               'up=$upstream_addr status=$status '
	               'sent=$bytes_sent recv=$bytes_received dur=$session_time';

	access_log /var/log/nginx/sni.log sni buffer=64k flush=5s;
	error_log /var/log/nginx/stream-error.log warn;

	server {
		listen 443 reuseport;

		ssl_preread on;
		preread_timeout 5s;

		proxy_pass $sni_upstream;
		proxy_connect_timeout 10s;
		proxy_timeout 300s;
		proxy_buffer_size 32k;
		proxy_socket_keepalive on;
	}
}
