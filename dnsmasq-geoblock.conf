###############################################################################
# dnsmasq: подмена адресов для сервисов, закрытых для России и Беларуси
#
# СГЕНЕРИРОВАНО автоматически из services.yaml — не правьте этот файл руками,
# изменения потеряются. Правьте services.yaml и запускайте generate.py заново.
#
# Домены: 492 в 11 категориях
# Адрес сервера: 153.80.200.170
# Дата: 2026-08-05
#
# УСТАНОВКА — этот файл заменяет /etc/dnsmasq.conf целиком
#   dnsmasq --test -C dnsmasq-geoblock.conf
#   cp dnsmasq-geoblock.conf /etc/dnsmasq.conf
#   systemctl restart dnsmasq
#
# Здесь намеренно нет conf-dir=/etc/dnsmasq.d/ — иначе к этому конфигу молча
# подмешивались бы посторонние файлы, и итоговый набор опций перестал бы
# соответствовать services.yaml. Если каталог всё же нужен, добавьте conf-dir
# в dnsmasq_options в services.yaml.
#
# ВАЖНО
#   * address=/example.com/IP покрывает и example.com, и все его поддомены.
#   * Здесь заданы только записи A. Проверьте, что AAAA возвращается пустым
#     (dig AAAA claude.ai @<сервер>) — иначе клиент с IPv6 пойдёт напрямую
#     и получит блокировку. Лечится filter-AAAA в dnsmasq-full.
#   * В браузере нужно отключить DNS-over-HTTPS, иначе он не спросит этот сервер.
#   * На сервере закройте UDP/443 через reject, чтобы браузер сразу
#     откатился с HTTP/3 на TCP: ssl_preread не читает QUIC.
###############################################################################

# --- опции сервера ---------------------------------------------------------
listen-address=0.0.0.0
port=53
no-resolv
no-hosts
server=1.1.1.1
server=8.8.8.8
cache-size=10000
bogus-priv
bind-interfaces
filter-AAAA

