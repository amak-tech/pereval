###############################################################################
# dnsmasq: reverse-geoblock override                                          #
#                                                                             #
# Purpose: services that REFUSE clients from Russia / Belarus. Each domain    #
# below is answered with the IP of your Kazakhstan box, which SNI-proxies      #
# the TCP connection onward, so the origin sees a KZ source address.           #
#                                                                             #
# This file does NOT contain Roskomnadzor/BY-censor blocklists - only          #
# outbound geo-restrictions imposed by the services themselves.                #
#                                                                             #
# Source: https://github.com/itdoginfo/allow-domains                          #
#         Categories/geoblock.lst + Services/google_ai.lst                    #
# Domains: 487
#                                                                             #
# INSTALL                                                                     #
#   1. sed -i 's/203\.0\.113\.10/<YOUR_KZ_IP>/g' dnsmasq-geoblock.conf       #
#   2. cp dnsmasq-geoblock.conf /etc/dnsmasq.d/  (or conf-file= it)            #
#   3. dnsmasq --test -C /etc/dnsmasq.d/dnsmasq-geoblock.conf                  #
#   4. systemctl restart dnsmasq                                               #
#                                                                             #
# NOTES                                                                       #
#   * address=/example.com/IP matches example.com AND every subdomain.         #
#   * Only A records are defined here. Confirm AAAA comes back empty on your   #
#     build (dig AAAA claude.ai @<your-dns>) - if it does not, a dual-stack     #
#     client will reach the origin over IPv6 directly and get geo-blocked.      #
#     Fix with filter-AAAA (dnsmasq-full) or disable IPv6 on the client.        #
#   * Disable 'Secure DNS'/DoH in the browser or none of this is consulted.    #
#   * Block UDP/443 on the KZ box so browsers fall back from HTTP/3 to TCP;    #
#     nginx ssl_preread cannot read a QUIC ClientHello.                        #
###############################################################################

# --- global options (uncomment as needed) ---------------------------------
#no-resolv
#server=1.1.1.1
#server=8.8.8.8
#cache-size=10000
# dnsmasq-full only: hard-strip AAAA so nothing escapes over IPv6
#filter-AAAA

listen-address=0.0.0.0
port=53
no-resolv
no-hosts
server=1.1.1.1
server=8.8.8.8
cache-size=10000
bogus-priv
bind-interfaces

