user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 64k;

    # IP клиентов в access-логе не нужны — приватность; ошибки остаются в error.log
    access_log off;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Лимиты: вход/оплата/лиды/DDNS — грубая защита на входе, точная — в приложении
    limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=forms:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=ddns:10m rate=6r/m;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    upstream app {
        server app:3000;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
