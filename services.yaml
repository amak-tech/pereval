# Единый источник данных: домены, пулы воркеров, категории, сервисы и их домены.
#
# Из этого файла generate.py собирает конфиги dnsmasq/nginx для всех нод и
# каталог сервисов для веб-приложения (web/src/generated/services.json):
#
#     python3 src/generate.py services.yaml 153.80.200.170
#
# Структура:
#   meta             название и адрес сайта (лендинг, кабинет, API)
#   free             домены DNS бесплатной версии (основной + устаревшие, которые
#                    продолжают работать для старых профилей)
#   nodes            кластер Free: основной узел (primary), пулы и воркеры
#   dnsmasq_options  строки, которые попадут в блок опций dnsmasq как есть
#   categories       Free-каталог: категория (id, pool) -> сервисы (pool) -> домены.
#                    Поддомены включаются автоматически: anthropic.com покрывает
#                    api.anthropic.com, поэтому дочерние записи указывать не нужно
#   disabled         группы доменов, закомментированных в конфиге, с пояснением
#   passthrough      домены, которые НЕЛЬЗЯ проксировать: российские сервисы,
#                    блокирующие зарубежные адреса, включая казахстанские
#   pro              инфраструктура и каталог платной версии (DNS-нода, пулы,
#                    воркеры, категории)
#
# Пулы воркеров. У каждого сервиса есть пул: явно у сервиса, иначе у категории,
# иначе «default». Все домены сервиса резолвятся в ОДНУ ноду пула (выбор
# детерминированный, rendezvous-хэш по имени сервиса) — важно для сервисов,
# которым нужен постоянный IP (ИИ-платформы). «Тяжёлые» сервисы (видео, соцсети)
# можно вынести в отдельный пул на другие ноды. Пул без живых нод уходит
# в fallback, затем на primary.
#
# После правок стоит прогнать проверку — она ловит дубли, конфликты
# с passthrough, неизвестные пулы и уже покрытые поддомены:
#
#     python3 src/generate.py services.yaml 153.80.200.170 --check

meta:
  name: Перевал
  origin: https://pereval.top

free:
  domain: free.pereval.top                 # DoH https://free.pereval.top/dns-query, DoT free.pereval.top
  legacy_domains:
    - pereval.portbuddy.tech               # старое имя: DoH/DoT продолжают работать, сайт -> 301 на origin

nodes:
  primary: 153.80.200.170
  include_primary_in_dns: false   # false = отдавать в DNS только здоровые воркеры; true = включать primary наравне с воркерами
  probe_sni: claude.ai
  max_clients: 300                # порог активных клиентов за 5 минут по умолчанию для нод Free
  pools:
    default:
      note: Общий пул — всё, у чего пул не задан явно.
    ai:
      note: ИИ-платформы — важно, чтобы все запросы сервиса шли с одного IP/локации.
      fallback: default
      max_clients: 200             # защита IP ИИ-нод от бана Google Gemini (unusual traffic)
    media:
      note: Тяжёлый трафик (видео, стриминги, соцсети) — отдельные ноды, чтобы не мешать ИИ.
      fallback: default
  workers:
    # Добавляйте сюда дополнительные VPS-воркеры по мере роста нагрузки.
    # pools — в каких пулах участвует нода (по умолчанию только default).
    # По умолчанию для подключения к воркерам используются те же SSH-пользователь,
    # SSH-ключ и порт, что и для основного узла (primary).
    # При необходимости можно переопределить их для конкретного воркера напрямую
    # или через секреты GitHub Actions (переменные окружения):
    # - ip: 153.80.200.171
    #   name: kz-media-1
    #   pools: [media]
    #   weight: 1
    #   ssh_user_env: WORKER1_SSH_USER   # опционально: имя env-переменной (или ssh_user: ubuntu)
    #   ssh_key_env: WORKER1_SSH_KEY     # опционально: имя env-переменной с приватным ключом или путём (или ssh_key: ~/.ssh/id_ed25519)
    #   ssh_port: 22                     # опционально: по умолчанию наследует порт основного узла (22)

    - ip: 151.247.25.123
      name: nl-worker-1
      pools: [default, media]

    - ip: 144.31.159.147
      name: free-worker-ai-1
      pools: [ai]

    - ip: 144.31.159.185
      name: free-worker-ai-1
      pools: [ ai ]

dnsmasq_options:
  - listen-address=0.0.0.0
  - port=53
  - no-resolv
  - no-hosts
  - server=1.1.1.1
  - server=8.8.8.8
  - cache-size=10000
  - min-cache-ttl=300
  - dns-forward-max=1000
  - max-tcp-connections=500
  - bogus-priv
  - bind-interfaces
  - filter-AAAA
  - filter-rr=HTTPS,SVCB
  - local-ttl=60
