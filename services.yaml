# =============================================================================
# Перевал Pro — платная версия. Отдельная DNS-нода и отдельные прокси-воркеры.
# Каталог Pro = все категории Free (они тоже уходят через Pro-воркеры)
# + категории ниже. Списки доменов — стартовые, проверяйте каждый сервис
# с Pro-воркера перед публикацией на странице.
# =============================================================================
pro:
  domain: pro.pereval.top                  # DoH https://pro.pereval.top/dns/<token>, DoT <token>.pro.pereval.top
  dns_ip: 85.209.148.147                   # VPS pro-dns
  cp_ip: 91.149.179.184                    # VPS pereval.top (control plane) — для nftables на воркерах
  max_clients: 200                         # порог активных клиентов за 5 минут по умолчанию для нод Pro
  pools:
    default:
      note: Общий пул Pro.
    ai:
      note: ИИ-платформы Pro — постоянный IP на сервис.
      fallback: default
      max_clients: 100                      # консервативный лимит для пула ai в Pro (защита от бана Google Gemini)
    media:
      note: Стриминги и TikTok Pro — тяжёлый трафик.
      fallback: default
    reserve:
      note: Карантин — воркер выведен из обслуживания (его выходной IP Google относит к RU/недоступному региону; см. YouTube "GL" перед вводом в пул ai).
  workers:
    # Каждый Pro-воркер — отдельная нода в CP со своим Bearer-секретом (pnpm admin node add <name> pro_worker <ip>).
    # deploy.sh берёт секрет из env-переменной secret_env (по умолчанию <NAME>_SECRET: pro-worker-ai-1 →
    # PRO_WORKER_AI_1_SECRET), а если она пуста — из общего PRO_WORKER_SECRET. Переменные пробрасывает deploy.yml.
    - ip: 141.11.197.214                   # VPS pro-worker-default-1 — общий пул (+ media и временно ai через тот же воркер)
      name: pro-worker-default-1
      pools: [default, media, ai]
    - ip: 141.11.197.239                   # VPS pro-worker-ai-1 — в карантине: 151.247.25.133 и 141.11.197.239 Google считает RU, Gemini отдаёт «регион недоступен»
      name: pro-worker-ai-1
      pools: [reserve]
  categories:
    # Каталог Pro намеренно короткий: только сервисы, геоблок которых подтверждён пробами
    # из РФ (Yandex Cloud) и РБ (Белтелеком) против эталона с нидерландского воркера 2026-11-10,
    # и за которые есть реальный спрос. Что не геоблокируется (Reddit, Pinterest, Trello,
    # Duolingo, Figma, Slack, Docker Hub) — в Pro не держим.
    - id: media
      name: Музыка, видео и TikTok
      pool: media
      services:
        - name: Spotify                      # закрыт для РФ (why-not-available), в РБ работает
          domains:
            - spotify.com
            - scdn.co
            - spotifycdn.com
            - spotifycdn.net
            - spoti.fi
        - name: Netflix                      # закрыт для РФ; оплата из РФ невозможна, поэтому не в заголовках
          # Видео-CDN nflxvideo.net намеренно не проксируется: регион определяется
          # на netflix.com, а сам поток идёт напрямую с Open Connect — так работают
          # классические Smart DNS и не расходуется канал воркера.
          domains:
            - netflix.com
            - nflxext.com
            - nflximg.net
            - nflxso.net
        - name: Twitch                       # не геоблок, а замедление у провайдеров РФ: через воркер идёт 1080p
          domains:
            - twitch.tv
            - ttvnw.net
            - jtvnw.net
            - twitchcdn.net
            - twitchsvc.net
        - name: TikTok                       # с 2022 для РФ урезанный режим: старая лента, без загрузки
          domains:
            - tiktok.com
            - tiktokcdn.com
            - tiktokcdn-us.com
            - tiktokcdn-eu.com
            - tiktokv.com
            - tiktokv.us
            - tiktokstatic.com
            - ttwstatic.com
            - byteoversea.com
            - ibyteimg.com
            - ibytedtos.com
            - muscdn.com
            - musical.ly
        - name: ElevenLabs / Suno            # ElevenLabs: geo-restriction для РФ и РБ
          pool: ai
          domains:
            - elevenlabs.io
            - suno.com
            - suno.ai
    - id: work
      name: Рабочие инструменты и учёба
      pool: default
      services:
        - name: Notion                       # с сентября 2024 закрыт для РФ (403), в РБ работает
          domains:
            - notion.so
            - notion.site
            - notion.com
            - notion.new
            - notionusercontent.com
            - notion-static.com
            - makenotion.com
        - name: Miro                         # с 15.10.2026 геоблок IP РФ и РБ, включая бесплатные аккаунты
          domains:
            - miro.com
            - realtimeboard.com
        - name: Canva                        # закрыт для РФ с июня 2022
          domains:
            - canva.com
            - canva.link
        - name: Adobe (Firefly, Creative Cloud)  # Firefly: denied для РФ и РБ; adobe.com целиком закрыт для РБ
          domains:
            - adobe.com
            - adobelogin.com
            - adobe.io
        - name: Airtable                     # с 19.02.2026 закрыт для РФ (обрыв TLS), в РБ работает
          domains:
            - airtable.com
            - airtableusercontent.com
            - airtableblocks.com
        - name: Grammarly                    # 451 для РБ, обрыв TLS для РФ
          domains:
            - grammarly.com
            - grammarly.io
        - name: Coursera                     # закрыт для РФ (обрыв TLS), в РБ работает
          domains:
            - coursera.org
    - id: games
      name: Игры и консоли
      pool: default
      services:
        # ВАЖНО: SNI-прокси пропускает только TCP 80/443 — через него проходит
        # логин, магазин и API, но не UDP-трафик игровых серверов и стриминга.
        - name: Supercell (Brawl Stars, Clash Royale, Clash of Clans)
          domains:
            - supercell.com
            - supercellid.com
            - supercellgames.com
            - brawlstarsgame.com
            - clashroyale.com
            - clashofclans.com
        - name: Xbox                         # вход в Xbox Live из РФ: ошибка 0x80a40401
          domains:
            - xbox.com
            - xboxlive.com
            - xboxservices.com
        - name: PlayStation Network
          domains:
            - playstation.com
            - playstation.net
            - sonyentertainmentnetwork.com
        - name: NVIDIA GeForce NOW           # РФ и РБ вне списка регионов GFN
          domains:
            - geforcenow.com
            - nvidiagrid.net
