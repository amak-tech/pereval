# Единый источник данных: категории, сервисы и их домены.
#
# Из этого файла generate.py собирает dnsmasq-geoblock.conf и index.html:
#
#     python3 generate.py services.yaml 153.80.200.170
#
# Структура:
#   meta             название, домен сайта и дата обновления для страницы
#   dnsmasq_options  строки, которые попадут в блок опций dnsmasq как есть
#   categories       категория -> сервисы -> домены. Поддомены включаются
#                    автоматически: anthropic.com покрывает api.anthropic.com,
#                    поэтому дочерние записи указывать не нужно
#   disabled         группы доменов, закомментированных в конфиге, с пояснением
#   passthrough      домены, которые НЕЛЬЗЯ проксировать: российские сервисы,
#                    блокирующие зарубежные адреса, включая казахстанские
#
# После правок стоит прогнать проверку — она ловит дубли, конфликты
# с passthrough и уже покрытые поддомены:
#
#     python3 generate.py services.yaml 153.80.200.170 --check

meta:
  name: Перевал
  origin: https://pereval.portbuddy.tech
  date: '2026-08-05'
dnsmasq_options:
  - listen-address=0.0.0.0
  - port=53
  - no-resolv
  - no-hosts
  - server=1.1.1.1
  - server=8.8.8.8
  - cache-size=10000
  - bogus-priv
  - bind-interfaces
  - filter-AAAA
