name: Deploy

on:
  release:
    types:
      - published
  workflow_call:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin fonts-dejavu-core
          pip install pyyaml

      - name: Generate configuration files
        env:
          SUTTON_IP_ADDRESS: ${{ secrets.SUTTON_IP_ADDRESS }}
        run: python3 generate.py services.yaml "$SUTTON_IP_ADDRESS"

      - name: Deploy to server
        env:
          SUTTON_IP_ADDRESS: ${{ secrets.SUTTON_IP_ADDRESS }}
          SUTTON_SSH_KEY: ${{ secrets.SUTTON_SSH_KEY }}
          SUTTON_SSH_USER: ${{ secrets.SUTTON_SSH_USER }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME}}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          # Optional per-worker secrets (referenced via ssh_user_env / ssh_key_env in services.yaml):
#          WORKER1_SSH_USER: ${{ secrets.WORKER1_SSH_USER }}
#          WORKER1_SSH_KEY: ${{ secrets.WORKER1_SSH_KEY }}
#          WORKER2_SSH_USER: ${{ secrets.WORKER2_SSH_USER }}
#          WORKER2_SSH_KEY: ${{ secrets.WORKER2_SSH_KEY }}
#          WORKER3_SSH_USER: ${{ secrets.WORKER3_SSH_USER }}
#          WORKER3_SSH_KEY: ${{ secrets.WORKER3_SSH_KEY }}
        run: |
          SSH_KEY_FILE="$(mktemp)"
          trap 'rm -f "$SSH_KEY_FILE"' EXIT
          chmod 600 "$SSH_KEY_FILE"
          printf '%s\n' "$SUTTON_SSH_KEY" > "$SSH_KEY_FILE"
          chmod +x deploy.sh
          ./deploy.sh "$SUTTON_IP_ADDRESS" "$SSH_KEY_FILE" "$SUTTON_SSH_USER"
